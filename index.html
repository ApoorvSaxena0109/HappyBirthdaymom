<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Mom - Manisha Srivastava</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            background: linear-gradient(135deg, #fce4ec, #f3e5f5, #e8eaf6);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            max-width: 600px;
            width: 100%;
            overflow: hidden;
        }

        .card-header {
            background: linear-gradient(135deg, #e91e63, #9c27b0);
            color: white;
            text-align: center;
            padding: 40px 30px;
        }

        .card-header h1 {
            font-size: 2.2rem;
            margin-bottom: 8px;
        }

        .card-header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .profile {
            padding: 40px 30px;
            text-align: center;
        }

        .profile-icon {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #e91e63, #9c27b0);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 2.5rem;
        }

        .profile h2 {
            font-size: 1.8rem;
            color: #333;
            margin-bottom: 6px;
        }

        .profile .role {
            display: inline-block;
            background: linear-gradient(135deg, #e91e63, #9c27b0);
            color: white;
            padding: 6px 20px;
            border-radius: 20px;
            font-size: 0.95rem;
            margin-bottom: 24px;
        }

        .details {
            text-align: left;
            padding: 0 10px;
        }

        .detail-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #f0f0f0;
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .detail-label {
            color: #888;
            font-size: 0.95rem;
        }

        .detail-value {
            color: #333;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .message {
            background: #fce4ec;
            margin: 20px 30px 30px;
            padding: 24px;
            border-radius: 12px;
            text-align: center;
        }

        .message p {
            color: #c2185b;
            font-size: 1.05rem;
            line-height: 1.6;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="card-header">
            <h1>Happy Birthday, Mom!</h1>
            <p>A tribute to the most amazing teacher and mother</p>
        </div>

        <div class="profile">
            <div class="profile-icon">&#x1F469;&#x200D;&#x1F3EB;</div>
            <h2>Manisha Srivastava</h2>
            <span class="role">Teacher</span>

            <div class="details">
                <div class="detail-row">
                    <span class="detail-label">Name</span>
                    <span class="detail-value">Manisha Srivastava</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Profession</span>
                    <span class="detail-value">Teacher</span>
                </div>
                <div class="detail-row">
                    <span class="detail-label">Role</span>
                    <span class="detail-value">Educator &amp; Mother</span>
                </div>
            </div>
        </div>

        <div class="message">
            <p>"A mother is your first teacher, and the best teacher you'll ever have. Happy Birthday to ours!"</p>
        </div>
    </div>
</body>
</html>
